name: Build FarLove Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Placeholder Assets
        run: |
          mkdir -p assets
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAA=" | base64 -d > assets/icon.png
          cp assets/icon.png assets/splash.png
          cp assets/icon.png assets/adaptive-icon.png

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android Native
        run: npx expo prebuild --platform android --clean

      - name: Bypass Line 14 and Patch Gradle
        run: |
          # 1. Patch compileSdkVersion in app build.gradle
          sed -i 's/compileSdkVersion rootProject.ext.compileSdkVersion/compileSdkVersion 34/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion rootProject.ext.targetSdkVersion/targetSdkVersion 34/' android/app/build.gradle || true

          # 2. Hardcode react root
          RN_DIR="$GITHUB_WORKSPACE/node_modules/react-native"
          sed -i "s|.*react.root = .*|    react.root = file(\"$RN_DIR\")|" android/app/build.gradle || true
          sed -i "s|.*react-native/package.json.*|    return file(\"$RN_DIR\")|" android/app/build.gradle || true

          # 3. Add bundleInRelease = false so Gradle skips failing metro step
          sed -i '/project.ext.react = \[/a \    bundleInRelease: false,' android/app/build.gradle || true

          # 4. Set gradle properties
          echo "NODE_BINARY=$(which node)" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Manually Pre-bundle JavaScript & Assets
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file node_modules/expo/AppEntry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3072m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FarLove-APK
          path: android/app/build/outputs/apk/release/*.apk
