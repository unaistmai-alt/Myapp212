name: Build FarLove Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & Metro Bundler
        run: |
          npm install --legacy-peer-deps
          npm install --save-dev metro metro-core @expo/metro-config@~0.10.7 --legacy-peer-deps

      - name: Setup Metro Configuration
        run: |
          cat << 'EOF' > metro.config.js
          const { getDefaultConfig } = require('@expo/metro-config');
          module.exports = getDefaultConfig(__dirname);
          EOF

      - name: Prebuild Android Native
        run: npx expo prebuild --platform android --clean

      - name: Bypass Line 14 and Patch Gradle
        run: |
          sed -i 's/compileSdkVersion rootProject.ext.compileSdkVersion/compileSdkVersion 34/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion rootProject.ext.targetSdkVersion/targetSdkVersion 34/' android/app/build.gradle || true

          RN_DIR="$GITHUB_WORKSPACE/node_modules/react-native"
          sed -i "s|.*react.root = .*|    react.root = file(\"$RN_DIR\")|" android/app/build.gradle || true
          sed -i "s|.*react-native/package.json.*|    return file(\"$RN_DIR\")|" android/app/build.gradle || true

          echo "NODE_BINARY=$(which node)" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3072m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FarLove-APK
          path: android/app/build/outputs/apk/release/*.apk
