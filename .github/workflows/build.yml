name: Build FarLove Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Placeholder Assets
        run: |
          mkdir -p assets
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAA=" | base64 -d > assets/icon.png
          cp assets/icon.png assets/splash.png
          cp assets/icon.png assets/adaptive-icon.png

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Android Native Project
        run: npx expo prebuild --platform android --clean

      - name: Fix Node and Gradle Paths
        run: |
          # Pass explicit node path to gradle
          NODE_PATH=$(which node)
          echo "NODE_BINARY=$NODE_PATH" >> android/gradle.properties
          
          # Fix compileSdkVersion in root build.gradle
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/' android/build.gradle || true
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/' android/build.gradle || true

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FarLove-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
