name: Build FarLove Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean Old Native Android Folder
        run: |
          rm -rf android ios

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Local Keystore and Credentials
        run: |
          keytool -genkeypair -v -storetype PKCS12 -keystore release.keystore -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=MyApp, OU=Mobile, O=App, L=Doha, S=Doha, C=QA"
          cat << 'EOF' > credentials.json
          {
            "android": {
              "keystore": {
                "keystorePath": "release.keystore",
                "keystorePassword": "123456",
                "keyAlias": "my-key-alias",
                "keyPassword": "123456"
              }
            }
          }
          EOF

      - name: Build APK on Expo Cloud
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli project:init --force
          eas build --platform android --profile preview --non-interactive --no-wait
